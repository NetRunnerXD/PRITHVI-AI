# Rituchakra — API + dashboard + local Ollama.
# Usage:
#   copy backend/.env.example backend/.env
#   docker compose up --build
# API  http://localhost:8000/docs
# Web  http://localhost:3000
# Put TLS in front (see deploy/Caddyfile) for phones and public web.

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    environment:
      HOST: "0.0.0.0"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8081,http://localhost:19006}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5}
      CACHE_DIR: /app/.cache
      VEXYL_STT_URL: ${VEXYL_STT_URL:-}
      VEXYL_TTS_URL: ${VEXYL_TTS_URL:-}
      VEXYL_API_KEY: ${VEXYL_API_KEY:-}
    volumes:
      - api-cache:/app/.cache
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "qwen2.5"]
    restart: "no"

  # Indic STT/TTS — not started by default. GPU recommended for TTS.
  # Request HF access for IndicConformer, then:
  #   $env:HF_TOKEN="hf_..."; $env:VEXYL_STT_URL="http://vexyl-stt:8080"; $env:VEXYL_TTS_URL="http://vexyl-tts:8080"
  #   docker compose --profile voice up --build
  vexyl-stt:
    profiles: ["voice"]
    build:
      context: https://github.com/vexyl-ai/vexyl-stt.git
      args:
        HF_TOKEN: ${HF_TOKEN:-}
    environment:
      VEXYL_STT_HOST: "0.0.0.0"
      VEXYL_STT_PORT: "8080"
      VEXYL_STT_DEVICE: ${VEXYL_STT_DEVICE:-cpu}
      VEXYL_STT_API_KEY: ${VEXYL_API_KEY:-}
    ports:
      - "8091:8080"
    restart: unless-stopped

  vexyl-tts:
    profiles: ["voice"]
    build:
      context: https://github.com/vexyl-ai/vexyl-tts.git
    environment:
      VEXYL_TTS_HOST: "0.0.0.0"
      VEXYL_TTS_PORT: "8080"
      VEXYL_TTS_DEVICE: ${VEXYL_TTS_DEVICE:-auto}
      VEXYL_TTS_API_KEY: ${VEXYL_API_KEY:-}
    ports:
      - "8092:8080"
    restart: unless-stopped

volumes:
  api-cache:
  ollama:
