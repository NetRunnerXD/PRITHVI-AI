# Rituchakra API on Fly.io. Deploy from GitHub Actions or:
#   fly deploy --config backend/fly.toml --dockerfile backend/Dockerfile
#
# App name can be changed once: fly apps create <name>

app = "rituchakra-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  HOST = "0.0.0.0"
  CACHE_DIR = "/app/.cache"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 40
    soft_limit = 20

  [[http_service.checks]]
    grace_period = "25s"
    interval = "30s"
    method = "GET"
    path = "/api/ready"
    timeout = "8s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024"
