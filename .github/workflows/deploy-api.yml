name: Deploy API (Hugging Face Space)

# Pushes to master/main that touch backend/ publish the FastAPI origin.
# GitHub *repository* secret HF_TOKEN = Hugging Face write token (hf_...).
# Optional HF_SPACE = owner/name (default {huggingface-username}/rituchakra-api).

on:
  push:
    branches: [master, main]
    paths:
      - "backend/**"
      - "deploy/space/**"
      - "backend/scripts/publish_space.py"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: hf-space-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install hub client
        run: python -m pip install -q "huggingface_hub>=0.26"
      - name: Check token is present
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys
          t = (os.environ.get("HF_TOKEN") or os.environ.get("HUGGING_FACE_HUB_TOKEN") or "").strip()
          if not t:
              print("HF_TOKEN is empty. Add it under Repo Settings → Secrets and variables → Actions (repository secret, not Environment).", file=sys.stderr)
              sys.exit(1)
          print(f"token_present=yes length={len(t)} prefix={t[:3]}")
          PY
      - name: Publish Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: python backend/scripts/publish_space.py
