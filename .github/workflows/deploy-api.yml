name: Deploy API (Hugging Face Space)

# Pushes to master/main that touch backend/ publish the FastAPI origin
# used by the website and the Android/Expo app.
# Requires repo secret HF_TOKEN (Hugging Face write token).
# Optional: HF_SPACE (default NetRunnerXD/rituchakra-api).

on:
  push:
    branches: [master, main]
    paths:
      - "backend/**"
      - "deploy/space/**"
      - "backend/scripts/publish_space.py"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: hf-space-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install hub client
        run: python -m pip install -q huggingface_hub
      - name: Publish Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: python backend/scripts/publish_space.py
