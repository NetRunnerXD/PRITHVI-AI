name: Deploy API (Render)

# Native Python (not Docker). After you create the Free web service from
# render.yaml (New → Blueprint), Render auto-deploys on push to main/master.
# Optional: RENDER_DEPLOY_HOOK retriggers a deploy from this job.

on:
  push:
    branches: [master, main]
    paths:
      - "backend/**"
      - "render.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: render-api
      cancel-in-progress: false
    steps:
      - name: Trigger Render (optional hook)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK || vars.RENDER_DEPLOY_HOOK }}
        run: |
          hook="${RENDER_DEPLOY_HOOK//$'\r'/}"
          hook="${hook#"${hook%%[![:space:]]*}"}"
          hook="${hook%"${hook##*[![:space:]]}"}"
          hook="${hook%\"}"
          hook="${hook#\"}"
          if [ -z "$hook" ]; then
            echo "No RENDER_DEPLOY_HOOK. That is OK if the repo is already a Render Blueprint/Web Service — Render deploys on git push by itself."
            echo "To also fire from Actions: Render → your service → Settings → Deploy Hook → GitHub repo secret RENDER_DEPLOY_HOOK."
            echo "First-time: https://dashboard.render.com/select-repo?type=blueprint"
            exit 0
          fi
          code=$(curl -sS -o /tmp/render-hook.out -w "%{http_code}" -X POST "$hook")
          echo "hook HTTP $code"
          cat /tmp/render-hook.out || true
          case "$code" in
            2*) echo "Render deploy requested." ;;
            *) echo "::error::Deploy hook returned HTTP $code. Recreate the hook URL in Render Settings." ; exit 1 ;;
          esac
