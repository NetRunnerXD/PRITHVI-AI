name: Deploy API (Render)

# Native Python web service (not Docker). Connect the GitHub repo in Render once.
# After that, Render auto-deploys on push. This job also pokes the deploy hook
# when RENDER_DEPLOY_HOOK is set (Dashboard → service → Settings → Deploy Hook).

on:
  push:
    branches: [master, main]
    paths:
      - "backend/**"
      - "render.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: render-api
      cancel-in-progress: false
    steps:
      - name: Trigger Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Add GitHub repository secret RENDER_DEPLOY_HOOK. Create a Free Python web service on Render (not Docker): New → Blueprint, or New → Web Service, rootDir backend, start uvicorn app.main:app --host 0.0.0.0 --port \$PORT. Then copy Settings → Deploy Hook."
            echo "Docs: https://github.com/NetRunnerXD/Rituchakra/blob/main/deploy/render.md"
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo "Render deploy requested."
