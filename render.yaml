# Render Blueprint — native Python, single Free web service.
# Dashboard: New → Blueprint → this repo. Instance: Free.
services:
  - type: web
    name: rituchakra-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: python -m pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 75
    healthCheckPath: /api/ready
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: CORS_ORIGINS
        value: "*"
      - key: CACHE_DIR
        value: /tmp/rituchakra-cache
      - key: PUBLIC_BASE_URL
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        sync: false
      - key: LLM_WORKER_TOKEN
        sync: false
      - key: LLM_FALLBACK
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: SNAPSHOT_TTL_S
        value: "600"
      - key: SNAPSHOT_SWR_S
        value: "3600"
      - key: APP_ROLE
        value: api
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: rituchakra
      - key: MONGODB_SAT_URI
        sync: false
      - key: MONGODB_SAT_DB
        value: rituchakra_sat
      - key: OM_SERVER_REFRESH
        value: "false"
      - key: MOSDAC_USER
        sync: false
      - key: MOSDAC_PASS
        sync: false
      - key: NASA_EARTHDATA_API
        sync: false
      - key: WEATHERBIT_API_KEY
        sync: false
