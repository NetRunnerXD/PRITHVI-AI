# Render Blueprint — native Python Free web API (Gemini fallback unchanged).
# Speech/TTS/STT stay local-only; do not add voice sidecars here.
services:
  - type: web
    name: rituchakra-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: python -m pip install -r requirements.txt && python scripts/fetch_pn_models.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 75
    healthCheckPath: /api/ready
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: CORS_ORIGINS
        value: "*"
      - key: CACHE_DIR
        value: /tmp/rituchakra-cache
      - key: PUBLIC_BASE_URL
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        sync: false
      - key: LLM_WORKER_TOKEN
        sync: false
      - key: LLM_FALLBACK
        value: gemini,groq
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: SNAPSHOT_TTL_S
        value: "600"
      - key: SNAPSHOT_SWR_S
        value: "3600"
      - key: APP_ROLE
        value: api
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: rituchakra
      - key: MONGODB_SAT_URI
        sync: false
      - key: MONGODB_SAT_DB
        value: rituchakra_sat
      - key: OM_SERVER_REFRESH
        value: "false"
      - key: MOSDAC_USER
        sync: false
      - key: MOSDAC_PASS
        sync: false
      - key: NASA_EARTHDATA_API
        sync: false
      - key: WEATHERBIT_API_KEY
        sync: false
      - key: PN_ENABLED
        value: "1"
      - key: PN_VERSION
        value: "v7"
      - key: PN_CORRECT_ENABLED
        value: "0"
      - key: PN_JUDGE_ENABLED
        value: "0"
      - key: PN_STALE_OBS_H
        value: "6"
      - key: PN_MODEL_RELEASE_REPO
        value: "NetRunnerXD/PRITHVI-AI-Archive"
      - key: PN_MODEL_RELEASE_TAG
        value: "pn-models-v7"
      - key: PN_MODEL_DOWNLOAD_TOKEN
        sync: false
      - key: INGEST_CRON_SECRET
        sync: false
